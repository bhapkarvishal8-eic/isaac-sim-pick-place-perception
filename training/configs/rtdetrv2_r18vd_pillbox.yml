__include__: [
  '../dataset/pill_box_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_r18vd_pillbox_fixedscale_v3
# Unique per-run output_dir (not the shared ./output/rtdetrv2_r18vd_pillbox used by
# every prior trial) -- that directory had checkpoint files silently overwritten/
# mixed across unrelated runs (invalid scale=True run's checkpoint0002-0009.pth sat
# alongside the interrupted corrected run's checkpoint0000-0001.pth under identical
# names). See docs/KNOWN_RISKS.md risk #4 addendum, 2026-08-12.


PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3


# Fine-tuning run on a small 2-class dataset, not training from scratch on
# full COCO -- far fewer epochs than the base config's 120e default. Actual
# value TBD once a smoke-test training loop confirms loss is decreasing at a
# reasonable pace; this is a placeholder pending that check, not a
# considered final value.
epoches: 24

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


train_dataloader:
  dataset:
    transforms:
      # Full ops list re-specified (not a partial override -- yaml_utils.merge_dict
      # replaces lists wholesale, it doesn't merge list items) to flip
      # ConvertPILImage's `scale` from dataloader.yml's default True to False.
      # Matches the decision already recorded in rtdetr_onnx_spec.md: train on
      # raw [0,255] pixel values, not [0,1]-normalized, because the deployed
      # isaac_ros_rtdetr pipeline's image_to_tensor_node defaults to scale=False.
      # That decision was documented but never actually applied to this config --
      # caught 2026-08-12 when auditing docs-vs-config drift after the multi-scale
      # trial kickoff. See docs/KNOWN_RISKS.md risk #4.
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: False}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 22
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    scales: ~  # fixed-scale extended-epoch run (10->20 epochs), testing whether pill mAP@0.5 keeps climbing

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: False}
